
  <mat-toolbar color="primary" [@toolbarAnimation]="showToolbar()? 'open':'close'">

      <span class="left-menu">
        <button (click)="sidenavOpeningService.toggle()" mat-icon-button id="navbar-toggle-button" aria-label="Example icon-button with menu icon">
          @if(sidenavOpeningService.isOpen()) {
            <mat-icon>close</mat-icon>
          } @else {
            <mat-icon>menu</mat-icon>
          }
        </button>
        ADMIN
      </span>

      <a class="logo" routerLink="/">

      </a>

    <span class="right-menu">
      @if(!authenticated) {
        <button  mat-icon-button (click)="login()"  aria-label="icon-button with login icon">
        <mat-icon>login</mat-icon>
        </button>

      }
      @if(authenticated) {
        <p>{{user?.name}}</p>
      <button  mat-icon-button (click)="logout()"  aria-label="icon-button with logout icon">
        <mat-icon>logout</mat-icon>
        </button>
      }
      </span>

  </mat-toolbar>
